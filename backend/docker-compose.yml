services:
  # 1. Redis Cache service
  redis:
    image: redis:alpine
    container_name: ai_redis
    ports:
      - "6379:6379"
    
  # 2. Auth Service
  auth-service:
    build: ./services/auth
    container_name: auth_service
    ports:
      - "8001:8001"
    depends_on:
      - redis
    env_file:
      - ./services/auth/.env_file

  # 3. Agent Service
  agent-service:
    build: ./services/agent
    container_name: agent_service
    ports:
      - "8002:8002"
    depends_on:
      - redis
    env_file:
      - ./services/agent/.env_file

  # 4. chat services
  chat-service:
    build: ./services/chat
    container_name: chat_service
    ports:
      - "8003:8003"
    depends_on:
      - redis
    env_file:
      - ./services/chat/.env_file

  # 5. payment service
  payment-service:
    build: ./services/payment
    container_name: payment_service
    ports:
      - "8004:8004"
    depends_on:
      - redis
    env_file:
      - ./services/payment/.env_file

  # 6. gateway service
  gateway:
    build: ./gatway
    container_name: api_gatway
    ports:
      - "8000:8000"
    depends_on:
      - redis
      - auth-service
      - agent-service
      - chat-service
      - payment-service
    env_file:
      - ./gatway/.env